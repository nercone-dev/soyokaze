name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    if: "!github.event.release.prerelease"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Update version in Cargo.toml and pyproject.toml
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" Cargo.toml
          sed -i "s/^version = .*/version = \"${VERSION}\"/" python/pyproject.toml
          echo "Soyokaze ${VERSION}"

      - name: Commit and push version update
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Cargo.toml python/pyproject.toml

          if git diff --cached --quiet; then
            echo "No changes; skipping commit."
          else
            git commit -m "Release ${VERSION}"
            git push origin main
          fi

          echo "Almost ready for releasing [Soyokaze ${VERSION}]. Good luck!"

  test:
    name: Test (${{ matrix.os }}-${{ matrix.arch }})
    needs: update
    runs-on: ${{ matrix.runner }}
    if: "!github.event.release.prerelease"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos
            arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos
            arch: aarch64
            runner: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev golang-go perl

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake go

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.arch }}-${{ matrix.os }}

      - name: Run cargo check
        run: cargo check

      - name: Run cargo test
        run: cargo test --all-features

      - name: Run cargo clippy
        run: cargo clippy

  test-doc:
    name: Test Documentation
    needs: [update, test]
    runs-on: ubuntu-latest
    if: "!github.event.release.prerelease"

    env:
      RUSTDOCFLAGS: -D warnings

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev golang-go perl

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-doc

      - name: Build the documentation
        run: cargo doc --no-deps --all-features

  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    needs: [update, test, test-doc]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos
            arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos
            arch: aarch64
            runner: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev golang-go perl

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake go

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.arch }}-${{ matrix.os }}

      - name: Build the shared library
        run: cargo build --release --lib

      - name: Check the C header against what is about to ship
        if: runner.os == 'Linux'
        env:
          CARGO_TERM_COLOR: never
        run: |
          cc -std=c11 -Wall -Wextra -Iinclude tests/ffi.c -Ltarget/release -lsoyokaze -o ffi-shared
          LD_LIBRARY_PATH=target/release ./ffi-shared

          libs=$(cargo rustc --release --lib --crate-type staticlib -- --print native-static-libs 2>&1 \
                 | sed -n 's/^note: native-static-libs: //p' | tail -n1)
          if [ -z "$libs" ]; then
            echo "::error::rustc reported no native static libs; the link would fail obscurely"
            exit 1
          fi
          echo "native static libs: $libs"
          cc -std=c11 -Wall -Wextra -Iinclude tests/ffi.c target/release/libsoyokaze.a $libs -o ffi-static
          ./ffi-static

      - name: Package
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"

          name="soyokaze-${VERSION}-${{ matrix.arch }}-${{ matrix.os }}"
          mkdir -p "staging/$name"

          cp target/release/libsoyokaze.* "staging/$name/"
          cp include/soyokaze.h README.md LICENSE "staging/$name/"

          case "$RUNNER_OS" in
            Linux) shared=libsoyokaze.so ;;
            macOS) shared=libsoyokaze.dylib ;;
          esac
          for required in "$shared" libsoyokaze.a libsoyokaze.rlib soyokaze.h; do
            if [ ! -f "staging/$name/$required" ]; then
              echo "::error::$required is missing from the archive"
              exit 1
            fi
          done

          ls -l "staging/$name"

          tar -czf "$name.tar.gz" -C staging "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      - name: Attach to the release
        run: gh release upload "$TAG" "$ASSET" --clobber
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}

  build-ffi:
    name: Build FFI (${{ matrix.os }}-${{ matrix.arch }})
    needs: [update, test, test-doc]
    runs-on: ${{ matrix.runner }}
    if: "!github.event.release.prerelease"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos
            arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos
            arch: aarch64
            runner: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev golang-go perl

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake go

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-ffi-${{ matrix.arch }}-${{ matrix.os }}

      - name: Build every library form
        run: cargo build --lib

      - name: Build and run the C test against the shared library
        run: |
          cc -std=c11 -Wall -Wextra -Iinclude tests/ffi.c -Ltarget/debug -lsoyokaze -o ffi-shared
          case "$RUNNER_OS" in
            Linux) LD_LIBRARY_PATH=target/debug ./ffi-shared ;;
            macOS) DYLD_LIBRARY_PATH=target/debug ./ffi-shared ;;
          esac

      - name: Build and run the C test against the static library
        env:
          CARGO_TERM_COLOR: never
        run: |
          libs=$(cargo rustc --lib --crate-type staticlib -- --print native-static-libs 2>&1 \
                 | sed -n 's/^note: native-static-libs: //p' | tail -n1)
          if [ -z "$libs" ]; then
            echo "::error::rustc reported no native static libs; the link would fail obscurely"
            exit 1
          fi
          echo "native static libs: $libs"
          cc -std=c11 -Wall -Wextra -Iinclude tests/ffi.c target/debug/libsoyokaze.a $libs -o ffi-static
          ./ffi-static

  build-python:
    name: Build Python Binding (${{ matrix.os }}-${{ matrix.arch }})
    needs: [update, test, test-doc]
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64
            wheel_tag: manylinux_2_28_x86_64
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64
            wheel_tag: manylinux_2_28_aarch64
          - os: macos
            arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            deployment_target: "10.12"
            wheel_tag: macosx_10_12_x86_64
          - os: macos
            arch: aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            deployment_target: "11.0"
            wheel_tag: macosx_11_0_arm64

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          dnf install -y 'dnf-command(config-manager)'
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y cmake clang clang-devel golang perl curl git gh

      - name: Mark the workspace as a safe directory
        if: runner.os == 'Linux'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake go

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-python-${{ matrix.arch }}-${{ matrix.os }}

      - name: Build the shared library
        run: cargo build --release --lib
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}

      - name: Copy the shared library into the package (Linux)
        if: runner.os == 'Linux'
        run: cp target/release/libsoyokaze.so python/src/soyokaze/

      - name: Copy the shared library into the package (macOS)
        if: runner.os == 'macOS'
        run: cp target/release/libsoyokaze.dylib python/src/soyokaze/

      - name: Make a CPython interpreter available
        if: runner.os == 'Linux'
        run: echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Build the wheel
        working-directory: python
        run: uv build --wheel

      - name: Tag the wheel for this platform
        working-directory: python
        run: uvx --from wheel wheel tags --platform-tag ${{ matrix.wheel_tag }} --remove dist/*.whl

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.target }}
          path: python/dist/*.whl
          if-no-files-found: error

      - name: Attach to the release
        run: gh release upload "$TAG" python/dist/*.whl --clobber
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish
    needs: [update, test, test-doc, build, build-ffi, build-python]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev golang-go perl

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-python:
    name: Publish Python Binding
    needs: [update, test, test-doc, build, build-ffi, build-python]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download the built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
