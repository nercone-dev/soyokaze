name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify-version:
    name: Verify the release matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Compare the tag with the package version
        run: |
          tag_version="${TAG#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::release $TAG does not match Cargo.toml version $cargo_version"
            exit 1
          fi
        env:
          TAG: ${{ github.event.release.tag_name }}

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev golang-go perl
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  assets:
    name: ${{ matrix.target }}
    needs: [verify-version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev golang-go perl

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake go

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build the shared library
        run: cargo build --release --lib

      # Only on Linux. Linking against a macOS release dylib can trip an ld
      # check on the symbol table's alignment that has nothing to do with this
      # crate, and a release must not be blocked by it. The same check runs on
      # both platforms in test.yml, against the debug build.
      # CARGO_TERM_COLOR is off for this step because rustc reports the native
      # static libs as a diagnostic; coloured, the note arrives wrapped in
      # escape sequences and the pattern below matches nothing.
      - name: Check the C header against what is about to ship
        if: runner.os == 'Linux'
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          cc -std=c11 -Wall -Wextra -Iinclude tests/ffi.c -Ltarget/release -lsoyokaze -o ffi-shared
          LD_LIBRARY_PATH=target/release ./ffi-shared

          libs=$(cargo rustc --release --lib --crate-type staticlib -- --print native-static-libs 2>&1 \
                 | sed -n 's/^note: native-static-libs: //p' | tail -n1)
          if [ -z "$libs" ]; then
            echo "::error::rustc reported no native static libs; the link would fail obscurely"
            exit 1
          fi
          echo "native static libs: $libs"
          cc -std=c11 -Wall -Wextra -Iinclude tests/ffi.c target/release/libsoyokaze.a $libs -o ffi-static
          ./ffi-static

      # Everything cargo emitted for the library: the rlib for a Rust caller,
      # the cdylib and the staticlib for everyone else, and the dependency file.
      - name: Package
        shell: bash
        run: |
          name="soyokaze-${TAG}-${{ matrix.target }}"
          mkdir -p "staging/$name"

          cp target/release/libsoyokaze.* "staging/$name/"
          cp include/soyokaze.h README.md LICENSE "staging/$name/"

          # A glob that matched nothing would otherwise ship an archive with no
          # library in it.
          case "$RUNNER_OS" in
            Linux) shared=libsoyokaze.so ;;
            macOS) shared=libsoyokaze.dylib ;;
          esac
          for required in "$shared" libsoyokaze.a libsoyokaze.rlib soyokaze.h; do
            if [ ! -f "staging/$name/$required" ]; then
              echo "::error::$required is missing from the archive"
              exit 1
            fi
          done

          ls -l "staging/$name"

          tar -czf "$name.tar.gz" -C staging "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Attach to the release
        shell: bash
        run: gh release upload "$TAG" "$ASSET" --clobber
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish to crates.io
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev golang-go perl
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Not `--locked`: Cargo.lock is deliberately untracked, so a fresh
      # checkout has none for the flag to hold cargo to.
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
