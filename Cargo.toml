[package]
name = "soyokaze"
version = "0.6.1"
edition = "2024"
description = "HTTP/1/2/3 Library Crate"
readme = "README.md"
repository = "https://github.com/nercone-dev/soyokaze/"
license = "MIT"

[lib]
name = "soyokaze"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
boring = "=4.22.0"
boring-sys = "=4.22.0"
brotli = "8"
bytes = "1.12.1"
flate2 = "1"
foreign-types = "0.5"
quiche = { version = "0.29", features = ["boringssl-boring-crate"] }
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-boring = "=4.22.0"
tokio-quiche = "0.19"
zstd = "0.13"

[dev-dependencies]
rcgen = "0.14.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "test-util"] }

[profile.release]
lto = true
codegen-units = 1

[[bench]]
name = "helpers"
harness = false

[[bench]]
name = "models"
harness = false

[[bench]]
name = "protocol"
harness = false

[[bench]]
name = "websocket"
harness = false

[[bench]]
name = "allocations"
harness = false

[[bench]]
name = "load"
harness = false
